apiVersion: networking.k8s.io/v1                                                                 
kind: NetworkPolicy                                                                              
metadata:                                                                                        
  name: allow-frontend-to-backend                                                                
  namespace: secure-demo                                                                         
spec:                                                                                            
  podSelector:                                                                                   
    matchLabels:                                                                                 
      app: backend                                                                               
  policyTypes:                                                                                   
  - Ingress                                                                                      
  ingress:                                                                                       
  - from:                                                                                        
    - podSelector:                                                                               
        matchLabels:                                                                             
          role: frontend                                                                         
    ports:                                                                                       
    - protocol: TCP                                                                              
      port: 80                                                                                   
---                                                                                              
apiVersion: networking.k8s.io/v1                                                                 
kind: NetworkPolicy                                                                              
metadata:                                                                                        
  name: allow-frontend-egress-to-backend                                                         
  namespace: secure-demo                                                                         
spec:                                                                                            
  podSelector:                                                                                   
    matchLabels:                                                                                 
      role: frontend                                                                             
  policyTypes:                                                                                   
  - Egress                                                                                       
  egress:                                                                                        
  - to:                                                                                          
    - podSelector:                                                                               
        matchLabels:                                                                             
          app: backend                                                                           
    ports:                                                                                       
    - protocol: TCP                                                                              
      port: 80