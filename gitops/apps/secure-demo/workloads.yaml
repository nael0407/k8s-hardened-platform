apiVersion: v1                                                                                   
kind: Namespace                                                                                  
metadata:                                                                                        
  name: secure-demo                                                                              
---                                                                                              
apiVersion: apps/v1                                                                              
kind: Deployment                                                                                 
metadata:                                                                                        
  name: backend                                                                                  
  namespace: secure-demo                                                                         
  labels:                                                                                        
    app: backend                                                                                 
    role: backend                                                                                
spec:                                                                                            
  replicas: 1                                                                                    
  selector:                                                                                      
    matchLabels:                                                                                 
      app: backend                                                                               
  template:                                                                                      
    metadata:                                                                                    
      labels:                                                                                    
        app: backend                                                                             
        role: backend                                                                            
    spec:                                                                                        
      containers:                                                                                
      - name: nginx                                                                              
        image: nginx:1.27-alpine                                                                 
        ports:                                                                                   
        - containerPort: 80                                                                      
---                                                                                              
apiVersion: v1                                                                                   
kind: Service                                                                                    
metadata:                                                                                        
  name: backend-svc                                                                              
  namespace: secure-demo                                                                         
spec:                                                                                            
  selector:                                                                                      
    app: backend                                                                                 
  ports:                                                                                         
  - port: 80                                                                                     
    targetPort: 80                                                                               
---                                                                                              
apiVersion: v1                                                                                   
kind: Pod                                                                                        
metadata:                                                                                        
  name: frontend                                                                                 
  namespace: secure-demo                                                                         
  labels:                                                                                        
    app: frontend                                                                                
    role: frontend                                                                               
spec:                                                                                            
  containers:                                                                                    
  - name: curl                                                                                   
    image: curlimages/curl:8.10.1                                                                
    command: ["sleep", "infinity"]                                                               
---                                                                                              
apiVersion: v1                                                                                   
kind: Pod                                                                                        
metadata:                                                                                        
  name: attacker                                                                                 
  namespace: secure-demo                                                                         
  labels:                                                                                        
    app: attacker                                                                                
    role: attacker                                                                               
spec:                                                                                            
  containers:                                                                                    
  - name: curl                                                                                   
    image: curlimages/curl:8.10.1                                                                
    command: ["sleep", "infinity"]
